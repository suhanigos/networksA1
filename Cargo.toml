[workspace]
resolver = "2"
members = [
    ".",
    "switch_program_types",
    "switch_program_sdk",
]
default-members = [
    ".",
    "switch_program_types",
    "switch_program_sdk",
]
exclude = ["target", "examples", "viewer", "tools"]

[package]
name = "competitive_net_sim"
version = "0.1.0"
edition = "2024"

[features]
default = ["wasm"]
wasm = ["dep:wasmtime"]

[dependencies]
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
switch_program_types = { path = "switch_program_types", features = ["std"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
wasmtime = { version = "26", optional = true }

[dev-dependencies]
tempfile = "3"

[lib]
name = "competitive_net_sim"
path = "src/lib.rs"

[[bin]]
name = "competitive_net_sim"
path = "src/main.rs"
